<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alla scoperta di caligola</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="comic">

        <header>
            <p class="subtitle">una piccola avventura nella storia</p>
            <h1>Sei pronto a conoscere un imperatore molto particolare?</h1>
        </header>

        <section class="comic-card">

            <div class="progress-area">
                <span id="progress">1 / 16</span>
                <div class="progress-bar">
                    <div id="progressFill"></div>
                </div>
            </div>

            <div class="characters">

                <img
                    id="caligola"
                    src="immagini/caligola.PNG"
                    alt="Caligola"
                >

                <img
                    id="incitatus"
                    src="immagini/incitatus.PNG"
                    alt="Il cavallo Incitato"
                    class="horse"
                >

            </div>

            <div class="speech-bubble">
                <p id="dialogue"></p>
            </div>

            <div class="buttons">

                <button id="backButton" disabled>
                    ← INDIETRO
                </button>

                <button id="nextButton">
                    AVANTI →
                </button>

            </div>

        </section>

        <footer>
            <p> progetto storia classe ribaltata 🏛️</p>
        </footer>

    </main>

</body>
</html>
